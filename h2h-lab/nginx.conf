events {}

http {
    server {
        listen 80;
        server_name _;

        # Edge access control: block the admin area at the proxy.
        location = /admin        { return 403; }
        location = /admin/       { return 403; }
        location ^~ /admin/      { return 403; }

        # Everything else is proxied to the Tomcat backend.
        # The proxy passes ..;/ through literally; Tomcat resolves the
        # semicolon path-parameter + dot-segment, so /x/..;/admin/ reaches
        # the blocked resource. Classic Orange Tsai path-normalization gap.
        location / {
            proxy_pass http://tomcat:8080;
            proxy_set_header Host $host;
        }
    }
}
