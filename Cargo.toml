[package]
name = "sidedoor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Slybrick 403/401 bypass scanner — reliable access-control bypass testing"
authors = ["Slybrick"]

[[bin]]
name = "sidedoor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
